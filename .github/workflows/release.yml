name: Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-image-inputs:
    name: Build image inputs ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: v0.16.0

      - name: Build Rust binaries
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: |
          cargo build --release --target "${{ matrix.target }}" \
            -p desk-foreman --bin desk-foreman --bin export-openapi
          cargo build --release --target "${{ matrix.target }}" \
            -p desk-foreman-runner-manager --bin desk-foreman-runner-manager

      - name: Show sccache stats
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RUSTC_WRAPPER: sccache
          SCCACHE_BASEDIRS: ${{ github.workspace }}
          SCCACHE_BUCKET: sccache
          SCCACHE_ENDPOINT: https://12412d5b061683494ea3e5c217d6a961.r2.cloudflarestorage.com
          SCCACHE_REGION: auto
        run: sccache --show-stats

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Restore Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ matrix.arch }}-${{ hashFiles('frontend/package.json', 'frontend/bunfig.toml') }}
          restore-keys: |
            ${{ runner.os }}-bun-${{ matrix.arch }}-
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --no-save

      - name: Prepare image input directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-image-input/frontend-dist
          install -Dm755 "target/${{ matrix.target }}/release/desk-foreman" ci-image-input/desk-foreman
          install -Dm755 "target/${{ matrix.target }}/release/export-openapi" ci-image-input/export-openapi
          install -Dm755 "target/${{ matrix.target }}/release/desk-foreman-runner-manager" ci-image-input/desk-foreman-runner-manager

      - name: Export OpenAPI
        working-directory: frontend
        run: ../ci-image-input/export-openapi openapi.json

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          bun run gen:client
          bun run build
          cp -R dist/. ../ci-image-input/frontend-dist/

      - name: Upload Docker input
        uses: actions/upload-artifact@v7
        with:
          name: docker-input-${{ matrix.arch }}
          path: ci-image-input
          if-no-files-found: error
          retention-days: 7

  build-images:
    name: Build ${{ matrix.target }} ${{ matrix.arch }}
    needs:
      - build-image-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: runtime
            image_suffix: ""
          - arch: amd64
            runner: ubuntu-24.04
            target: runner-manager
            image_suffix: -runner-manager
          - arch: amd64
            runner: ubuntu-24.04
            target: workspace-runner
            image_suffix: -workspace-runner
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: runtime
            image_suffix: ""
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: runner-manager
            image_suffix: -runner-manager
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: workspace-runner
            image_suffix: -workspace-runner
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Docker input
        uses: actions/download-artifact@v8
        with:
          name: docker-input-${{ matrix.arch }}
          path: ci-image-input

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=raw,value=${{ github.ref_name }}-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-manifest:
    name: Publish multi-architecture manifests
    needs:
      - build-images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish version and latest manifests
        shell: bash
        run: |
          set -euo pipefail
          for suffix in "" "-runner-manager" "-workspace-runner"; do
            image="${IMAGE_NAME}${suffix}"
            docker buildx imagetools create \
              --tag "${image}:${GITHUB_REF_NAME}" \
              "${image}:${GITHUB_REF_NAME}-amd64" \
              "${image}:${GITHUB_REF_NAME}-arm64"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              "${image}:latest-amd64" \
              "${image}:latest-arm64"
            docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}"
          done
