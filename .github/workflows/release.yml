name: Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_amd64:
        description: Also build amd64 and publish multi-architecture tags
        type: boolean
        required: false
        default: false

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-arm64:
    name: Build ${{ matrix.target }} arm64
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image_suffix: ""
          - target: workspace-runner
            image_suffix: -workspace-runner
          - target: runner-manager
            image_suffix: -runner-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=raw,value=${{ github.ref_name }}-arm64
            type=raw,value=latest-arm64

      - name: Build and push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=desk-foreman-${{ matrix.target }}-arm64
          cache-to: type=gha,mode=max,scope=desk-foreman-${{ matrix.target }}-arm64

  build-amd64:
    name: Build ${{ matrix.target }} amd64
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_amd64 == true) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: runtime
            image_suffix: ""
          - target: workspace-runner
            image_suffix: -workspace-runner
          - target: runner-manager
            image_suffix: -runner-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}${{ matrix.image_suffix }}
          tags: |
            type=raw,value=${{ github.ref_name }}-amd64
            type=raw,value=latest-amd64

      - name: Build and push amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=desk-foreman-${{ matrix.target }}-amd64
          cache-to: type=gha,mode=max,scope=desk-foreman-${{ matrix.target }}-amd64

  publish-manifest:
    name: Publish multi-architecture manifests
    if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_amd64 == true) }}
    needs:
      - build-arm64
      - build-amd64
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish version and latest manifests
        shell: bash
        run: |
          set -euo pipefail
          for suffix in "" "-workspace-runner" "-runner-manager"; do
            image="${IMAGE_NAME}${suffix}"
            docker buildx imagetools create \
              --tag "${image}:${GITHUB_REF_NAME}" \
              "${image}:${GITHUB_REF_NAME}-amd64" \
              "${image}:${GITHUB_REF_NAME}-arm64"
            docker buildx imagetools create \
              --tag "${image}:latest" \
              "${image}:latest-amd64" \
              "${image}:latest-arm64"
            docker buildx imagetools inspect "${image}:${GITHUB_REF_NAME}"
          done
