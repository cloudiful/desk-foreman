name: Runner Manager Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-runner-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-manager:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    uses: actions/workflows/.forgejo/workflows/docker-publish.yml@main
    with:
      builds: '[{"platform":"linux/amd64","runner":"aio"}]'
      dockerfile_mode: builtin
      builder_name_prefix: desk-foreman-runner-manager
      image_repo: zot.cloud1ful.com/${{ github.repository }}-runner-manager
      build_command: cargo build --release -p desk-foreman-runner-manager --bin desk-foreman-runner-manager
      binary_mappings: '[{"source":"target/release/desk-foreman-runner-manager","destination":"desk-foreman-runner-manager"}]'
      frontend_enabled: false
      runtime_user: '10001:10001'
      runtime_user_name: desk-foreman
      runtime_tools: '["docker-cli"]'
      runtime_packages: '["bash"]'
      runtime_directories: '[{"path":"/workspace","owner":"10001:10001"},{"path":"/var/lib/desk-foreman","owner":"10001:10001"}]'
      runtime_expose: '3001'
      runtime_env: |
        RUNNER_MANAGER_BIND_ADDR=0.0.0.0:3001
        WORKSPACE_ROOT=/workspace
        RUNNER_WORKDIR=/workspace
        RUNNER_NETWORK_ENABLED=false
        RUNNER_MAX_OUTPUT_BYTES=262144
        RUNNER_MAX_SESSIONS=32
        RUNNER_PIDS_LIMIT=256
        RUNNER_MEMORY_LIMIT=1g
        RUNNER_CPU_LIMIT=2
        RUNNER_IDLE_TTL_SEC=1800
        DOCKER_CLI=docker
        HOME=/home/desk-foreman
      inline_cache_tag: latest-amd64
      manifest_tag: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
      publish_latest: "false"
