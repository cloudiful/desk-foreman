name: Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: aio
    env:
      CARGO_TERM_COLOR: always
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reset Docker build input
        shell: bash
        run: rm -rf ci-image-input

      - name: Build Rust artifacts
        uses: https://forgejo.cloud1ful.com/actions/workflows/actions/build-rust-artifacts@v0.3.1
        with:
          build_command: >-
            cargo build --release
            -p desk-foreman --bin desk-foreman --bin export-openapi
            && cargo build --release
            -p desk-foreman-runner-manager --bin desk-foreman-runner-manager
          binary_mappings: >-
            [{"source":"target/release/desk-foreman","destination":"desk-foreman"},
            {"source":"target/release/export-openapi","destination":"export-openapi"},
            {"source":"target/release/desk-foreman-runner-manager","destination":"desk-foreman-runner-manager"}]
          show_sccache_stats: "true"

      - name: Prepare Docker build input
        shell: bash
        run: mkdir -p ci-image-input/frontend-dist

      - name: Export OpenAPI
        working-directory: frontend
        run: ../ci-image-input/export-openapi openapi.json

      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          bun install --no-save
          bun run gen:client
          bun run build
          test -f dist/index.html
          cp -R dist/. ../ci-image-input/frontend-dist/

      - name: Build and push Docker images
        uses: https://forgejo.cloud1ful.com/actions/workflows/actions/publish-docker-targets@v0.3.1
        with:
          context: .
          dockerfile: ./forgejo.Dockerfile
          platform: linux/amd64
          targets: >-
            [{"target":"runtime","image_suffix":""},
            {"target":"runner-manager","image_suffix":"-runner-manager"},
            {"target":"workspace-runner","image_suffix":"-workspace-runner"}]
          builder_name_prefix: desk-foreman
          inline_cache: "true"
          inline_cache_tag: latest-amd64
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Publish Docker manifests
        uses: https://forgejo.cloud1ful.com/actions/workflows/actions/publish-docker-manifests@v0.3.1
        with:
          architectures: amd64
          targets: >-
            [{"target":"runtime","image_suffix":""},
            {"target":"runner-manager","image_suffix":"-runner-manager"},
            {"target":"workspace-runner","image_suffix":"-workspace-runner"}]
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}
