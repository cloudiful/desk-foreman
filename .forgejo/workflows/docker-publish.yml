name: Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    uses: actions/workflows/.forgejo/workflows/docker-publish.yml@main
    with:
      builds: '[{"platform":"linux/amd64","runner":"aio"}]'
      dockerfile_mode: builtin
      builder_name_prefix: desk-foreman-runtime
      build_command: cargo build --release -p desk-foreman --bin desk-foreman --bin export-openapi
      binary_mappings: >-
        [{"source":"target/release/desk-foreman","destination":"desk-foreman"},
        {"source":"target/release/export-openapi","destination":"export-openapi","include_in_image":false}]
      after_build_command: |
        "${RUST_OUTPUT_DIRECTORY:?}/export-openapi" frontend/openapi.json
        sccache --show-stats
      frontend_build_command: |
        bun run gen:client
        bun run build
        test -f dist/index.html
      runtime_user: '10001:10001'
      runtime_user_name: desk-foreman
      runtime_tools: '["docker-cli"]'
      runtime_packages: '["bash"]'
      runtime_directories: '[{"path":"/workspace","owner":"10001:10001"},{"path":"/var/lib/desk-foreman","owner":"10001:10001"}]'
      runtime_expose: '3000'
      runtime_env: |
        MCP_BIND_ADDR=0.0.0.0:3000
        WORKSPACE_ROOT=/workspace
        DEFAULT_SHELL=/bin/bash
        SESSION_IDLE_TTL_SEC=1800
        WEB_SESSION_TTL_SEC=604800
        WEB_COOKIE_NAME=desk_foreman_session
        WEB_COOKIE_SECURE=false
        MAX_OUTPUT_BYTES=262144
        PATCH_SURFACE_MODE=function_compat
        FRONTEND_DIST=/app/frontend/dist
        HOME=/home/desk-foreman
      inline_cache_tag: latest-amd64
      manifest_tag: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
      publish_latest: "false"
