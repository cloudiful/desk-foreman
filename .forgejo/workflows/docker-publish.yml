name: Docker Publish
run-name: Docker Publish by ${{ github.actor }}

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    uses: actions/workflows/.forgejo/workflows/docker-publish.yml@v0.6.0
    with:
      builds: >-
        [{"platform":"linux/amd64","runner":"aio"}]
      before_build_command: rm -rf ci-image-input
      build_command: >-
        export CARGO_TERM_COLOR=always RUSTC_WRAPPER=sccache;
        cargo build --release
        -p desk-foreman --bin desk-foreman --bin export-openapi
        && cargo build --release
        -p desk-foreman-runner-manager --bin desk-foreman-runner-manager
      binary_mappings: >-
        [{"source":"target/release/desk-foreman","destination":"desk-foreman"},
        {"source":"target/release/export-openapi","destination":"export-openapi"},
        {"source":"target/release/desk-foreman-runner-manager","destination":"desk-foreman-runner-manager"}]
      after_build_command: |
        set -euo pipefail
        mkdir -p ci-image-input/frontend-dist
        cd frontend
        ../ci-image-input/export-openapi openapi.json
        bun install --no-save
        bun run gen:client
        bun run build
        test -f dist/index.html
        cp -R dist/. ../ci-image-input/frontend-dist/
        cd ..
        sccache --show-stats
      context: .
      dockerfile: ./forgejo.Dockerfile
      targets: >-
        [{"target":"runtime","image_suffix":"","builder_name_prefix":"desk-foreman-runtime"},
        {"target":"runner-manager","image_suffix":"-runner-manager","builder_name_prefix":"desk-foreman-runner-manager"},
        {"target":"workspace-runner","image_suffix":"-workspace-runner","builder_name_prefix":"desk-foreman-workspace-runner"}]
      inline_cache: "true"
      inline_cache_tag: latest-amd64
      manifest_tag: ${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }}
      publish_latest: "false"
      push: true
      username: ${{ github.actor }}
    secrets:
      registry_token: ${{ secrets.REGISTRY_TOKEN }}
