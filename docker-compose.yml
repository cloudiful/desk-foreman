services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: desk_foreman
      POSTGRES_USER: desk_foreman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  desk-foreman:
    build:
      context: .
      target: runtime
    image: desk-foreman:local
    depends_on:
      - postgres
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://desk_foreman:change-me-local-only@postgres:5432/desk_foreman}
      DESK_FOREMAN_SECRET_MASTER_KEY: ${DESK_FOREMAN_SECRET_MASTER_KEY:-}
    volumes:
      - .:/workspace
    working_dir: /workspace
    restart: unless-stopped

  runner-manager:
    build:
      context: .
      target: runner-manager
    image: desk-foreman-runner-manager:local
    depends_on:
      - desk-foreman
    environment:
      RUNNER_MANAGER_TOKEN: ${RUNNER_MANAGER_TOKEN:-change-me-runner-token-local-only}
      DESK_FOREMAN_URL: http://desk-foreman:3000
      RUNNER_HOST_WORKSPACE_ROOT: ${PWD}
    volumes:
      - .:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /workspace
    restart: unless-stopped

  workspace-runner-image:
    build:
      context: .
      target: workspace-runner
    image: desk-foreman-workspace-runner:local
    command: ["/bin/bash", "-lc", "sleep infinity"]
    profiles: ["build-only"]

volumes:
  postgres-data:
