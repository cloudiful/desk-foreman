[package]
name = "desk-foreman-workspace-sdk"
version.workspace = true
edition.workspace = true
readme = "README.md"

[features]
default = []
approval = ["dep:desk-foreman-approval", "dep:serde_json"]

[dependencies]
desk-foreman-approval = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
